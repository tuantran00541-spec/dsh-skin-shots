name: top331-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: dsh-mnemon
            repo: omdsh-dev/dsh-mnemon
            grep: mnemon
          - plugin: dsh-memento
            repo: PerryLink/dsh-memento
            grep: memento
          - plugin: dsh-toolkit
            repo: omdsh-dev/dsh-toolkit
            grep: toolkit
          - plugin: dsh-plugin-manager
            repo: hrhgit/deepseek-harness-plugin-manager
            grep: plugin-manager
          - plugin: dsh-doctor
            repo: jorinyang/dsh-doctor
            grep: doctor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dsh + pnpm
        run: |
          npm install -g pnpm@11.7.0 @deepseek-ai/dsh
          dsh --version || true
      - name: Install plugin (record exit code, never fail job here)
        run: |
          set +e
          dsh plugin --profile web add "github:${{ matrix.repo }}" > install.log 2>&1; echo $? > install.exit
          set -e
          echo "--- install exit: $(cat install.exit)"
          tail -40 install.log
          echo "--- profile package.json:"
          cat ~/.dsh/profiles/web/package.json || echo "NO PROFILE package.json"
      - name: Verify registration in dump-config
        run: |
          set +e
          dsh --profile web --dump-config > dump.txt 2>&1; echo $? > dump.exit
          set -e
          echo "--- dump exit: $(cat dump.exit)"
          grep -i -A 8 "${{ matrix.grep }}" dump.txt | head -40 || echo "PLUGIN NOT IN DUMP"
      - name: Boot dsh web (does the plugin break boot?)
        run: |
          dsh --profile web --no-open --port 3080 > dsh.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "dsh web: http" dsh.log; then break; fi
            sleep 2
          done
          grep "dsh web: http" dsh.log && echo "BOOT OK" || echo "BOOT URL NOT FOUND"
          tail -20 dsh.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: top331-${{ matrix.plugin }}
          path: |
            install.log
            install.exit
            dump.txt
            dump.exit
            dsh.log
          if-no-files-found: warn
