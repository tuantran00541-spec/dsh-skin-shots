name: composer-keys-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dsh + pnpm
        run: |
          npm install -g pnpm@11.7.0 @deepseek-ai/dsh
          dsh --version || true
      - name: Install dsh-composer-keys (record exit code, never fail job here)
        run: |
          set +e
          dsh plugin --profile web add dsh-composer-keys > install.log 2>&1; echo $? > install.exit
          if [ "$(cat install.exit)" != "0" ]; then
            echo "npm name failed, trying github:zlqd123/dsh-composer-keys" >> install.log
            dsh plugin --profile web add github:zlqd123/dsh-composer-keys >> install.log 2>&1; echo $? > install.exit
          fi
          set -e
          echo "--- install exit: $(cat install.exit)"
          tail -40 install.log
          dsh --profile web --dump-config > dump.txt 2>&1 || true
          grep -i "composer-keys" dump.txt || echo "NOT IN DUMP"
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Start dsh + composer-keys test
        run: |
          dsh --profile web --no-open --port 3080 > dsh.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "dsh web: http" dsh.log; then break; fi
            sleep 2
          done
          grep "dsh web: http" dsh.log || echo "DSH DID NOT PRINT URL"
          export DSH_URL=$(grep -o "http://127.0.0.1:3080/[^ ]*" dsh.log | head -1)
          if [ -n "$DSH_URL" ]; then node shot-composer-keys.mjs; else echo "NO URL, SKIPPING SHOTS"; fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-keys-test
          path: |
            shots/
            dsh.log
            install.log
            install.exit
            dump.txt
          if-no-files-found: warn
