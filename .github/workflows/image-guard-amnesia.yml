name: image-guard-amnesia-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: dsh-image-guard
            repo: mafeis/dsh-image-guard
            grep: image-guard
          - plugin: dsh-image-amnesia
            repo: Choco-Zz/dsh-image-amnesia
            grep: amnesia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dsh + pnpm
        run: |
          npm install -g pnpm@11.7.0 @deepseek-ai/dsh
          dsh --version || true
      - name: Install plugin (record exit code, never fail job here)
        run: |
          set +e
          dsh plugin --profile web add "github:${{ matrix.repo }}" > install.log 2>&1; echo $? > install.exit
          set -e
          echo "--- install exit: $(cat install.exit)"
          tail -40 install.log
          echo "--- profile package.json:"
          cat ~/.dsh/profiles/web/package.json || echo "NO PROFILE package.json"
      - name: Verify registration in dump-config
        run: |
          set +e
          dsh --profile web --dump-config > dump.txt 2>&1; echo $? > dump.exit
          set -e
          echo "--- dump exit: $(cat dump.exit)"
          grep -i -A 8 "${{ matrix.grep }}" dump.txt | head -40 || echo "PLUGIN NOT IN DUMP"
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Start dsh + screenshot
        run: |
          dsh --profile web --no-open --port 3080 > dsh.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "dsh web: http" dsh.log; then break; fi
            sleep 2
          done
          grep "dsh web: http" dsh.log || echo "DSH DID NOT PRINT URL"
          export DSH_URL=$(grep -o "http://127.0.0.1:3080/[^ ]*" dsh.log | head -1)
          if [ -n "$DSH_URL" ]; then node shot-plugins.mjs; else echo "NO URL, SKIPPING SHOTS"; fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.plugin }}
          path: |
            shots/
            dsh.log
            install.log
            install.exit
            dump.txt
            dump.exit
          if-no-files-found: warn
