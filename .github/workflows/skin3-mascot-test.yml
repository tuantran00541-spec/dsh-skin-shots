name: skin3-mascot-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dsh + pnpm
        run: |
          npm install -g pnpm@11.7.0 @deepseek-ai/dsh
          dsh --version || true
      - name: Install skin3 (record exit code, never fail job here)
        run: |
          set +e
          dsh plugin --profile web add github:huantest2024/dsh-anime-theme > install.log 2>&1; echo $? > install.exit
          set -e
          echo "--- install exit: $(cat install.exit)"
          tail -40 install.log
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Start dsh + skin3 mascot test
        run: |
          dsh --profile web --no-open --port 3080 > dsh.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "dsh web: http" dsh.log; then break; fi
            sleep 2
          done
          grep "dsh web: http" dsh.log || echo "DSH DID NOT PRINT URL"
          export DSH_URL=$(grep -o "http://127.0.0.1:3080/[^ ]*" dsh.log | head -1)
          if [ -n "$DSH_URL" ]; then node shot-skin3-mascot.mjs; else echo "NO URL, SKIPPING SHOTS"; fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin3-mascot-test
          path: |
            shots/
            dsh.log
            install.log
            install.exit
          if-no-files-found: warn
